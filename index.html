<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Ribbon — CSS</title>
<style>
  :root {
    /* ---- ribbon tuning knobs (all editable in the config modal, "c") ---- */
    --slices: 150;         /* number of vertical curtain slices               */
    --persp: 600;          /* camera focal length, px                         */
    --edge-y: -60;         /* bottom-edge height at the far tail (up = neg.)  */
    --climb: 240;          /* how much the edge climbs as the ribbon nears    */
    --x-amp: 780;          /* main snake amplitude                            */
    --x-freq: 540;         /* main snake frequency, deg over the full path    */
    --rip-amp: 65;         /* secondary ripple amplitude                      */
    --z-amp: 180;          /* depth wave amplitude — keep <= 180 so depth     */
                           /* stays monotonic (DOM order == paint order)      */
  }

  * { margin: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    overflow: hidden;
    background: #03041a;
  }

  .scene {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(to bottom,
        #020217 0%,
        #060a2e 40%,
        #0b1a44 62%,
        #123056 78%,
        #0a1838 100%);
  }

  /* ---------- star field: tiled layers of tiny radial dots ---------- */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 35%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,.8), transparent 100%);
    background-size:
      340px 340px, 280px 280px, 420px 420px,
      300px 300px, 380px 380px, 520px 520px;
    opacity: .8;
  }

  /* soft ambient glow washing up from behind the ribbon */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 65% at 50% 62%,
        rgba(45, 220, 170, .16) 0%,
        rgba(45, 200, 220, .07) 40%,
        transparent 70%);
  }

  /* ---------- the ribbon: a fan of slices laid along a 3D sine path ----------
     Each slice carries its own perspective() transform instead of living in a
     shared preserve-3d scene: identical projection, but painting is plain DOM
     order. Since z is monotonic along the path, DOM order == depth order, so
     we get correct layering with zero plane-splitting artifacts. */
  .ribbon {
    position: absolute;
    left: 50%;
    top: 60%;                       /* world origin = vanishing point */
    pointer-events: none;
  }

  .ribbon > div {
    /* t runs 0 -> 1 from the far end of the ribbon to the near end */
    --t: calc((var(--i) + 0.5) / var(--slices));

    /* serpentine path: the x-wave dominates the linear sweep, so the ribbon
       snakes right -> back left -> out right as it approaches; z only ever
       increases (monotonic depth = no slice intersections = no glitches) */
    --x: calc(-380 + 1500 * var(--t)
              + var(--x-amp) * sin(var(--t) * var(--x-freq) * 1deg + 150deg)
              + var(--rip-amp) * sin(var(--t) * 1260deg + 80deg));
    --z: calc(-2100 + 2150 * var(--t)
              + var(--z-amp) * sin(var(--t) * 680deg + 60deg));

    /* altitude climbs steadily as the ribbon approaches: on screen the far
       tail hugs the horizon and each closer band sits ABOVE the farther
       ones, so the bright bottom edge stays unobstructed the whole way
       (the near end runs off the top of the frame) */
    --y: calc(var(--edge-y) - var(--climb) * var(--t) * var(--t)
              - 30 * sin(var(--t) * var(--x-freq) * 1deg - 120deg));

    /* analytic tangent of the path above (d/dt), used to aim each slice;
       the amp * freq * pi/180 factors keep it in sync with the knobs */
    --dx: calc(1500
               + var(--x-amp) * var(--x-freq) * pi / 180
                 * cos(var(--t) * var(--x-freq) * 1deg + 150deg)
               + var(--rip-amp) * 1260 * pi / 180
                 * cos(var(--t) * 1260deg + 80deg));
    --dz: calc(2150
               + var(--z-amp) * 680 * pi / 180
                 * cos(var(--t) * 680deg + 60deg));

    /* cheap pseudo-randoms per slice: jagged ray tops + edge decoherence */
    --r: calc(0.5 + 0.5 * sin(var(--i) * 127.1));
    --r2: calc(0.5 + 0.5 * sin(var(--i) * 311.7));
    --jx: calc(20 * (var(--r2) - 0.5));
    --jy: calc(12 * (var(--r) - 0.5));

    /* the far tail grows in from nothing instead of a hard vertical cut */
    --taper: min(1, calc(var(--t) * 3));

    /* identical boxes, bottom-center pinned to the vanishing point, so every
       slice shares the same transform-origin (= camera position) */
    position: absolute;
    width: 150px;
    height: 460px;
    left: -75px;
    top: -460px;
    transform-origin: 50% 100%;
    transform:
      perspective(calc(var(--persp) * 1px))
      translate3d(calc((var(--x) + var(--jx)) * 1px),
                  calc((var(--y) + var(--jy)) * 1px),
                  calc(var(--z) * 1px))
      rotateY(clamp(-58deg,
        calc(mod(atan2(calc(-1 * var(--dz)), var(--dx)) + 90deg, 180deg) - 90deg),
        58deg));
      /* mod() folds the tangent into ±90° — a gradient slab looks the same
         rotated 180°, so return legs of the snake get the correct slant.
         The clamp keeps fold-apex slices from going knife-edge-on: they
         stack into a soft bright column instead of a hard line. */

    /* bright green lower edge, blue fringe underneath, fading to pink above;
       curtain height (ragged ray tops + tail taper) via background-size */
    background:
      linear-gradient(to top,
        rgba( 70, 130, 255, 0)    0%,
        rgba( 70, 130, 255, .45)  4%,
        rgba( 90, 255, 180, .95)  9%,
        rgba( 70, 245, 185, .55) 24%,
        rgba(200, 130, 225, .26) 46%,
        rgba(255,  90, 190, .09) 72%,
        rgba(255,  90, 190, 0)   94%)
      bottom / 100% calc((300px + 160px * var(--r)) * var(--taper)) no-repeat;

    /* feather the vertical sides so slices melt together */
    -webkit-mask: linear-gradient(90deg, transparent, #000 33%, #000 67%, transparent);
            mask: linear-gradient(90deg, transparent, #000 33%, #000 67%, transparent);

    /* haze: the far end fades out like real atmosphere */
    opacity: calc((0.22 + 0.70 * var(--t)) * var(--taper) * var(--taper));
  }

  /* ---------- foreground: mountain silhouettes ---------- */
  .mountains {
    position: absolute;
    inset: auto 0 0 0;
    height: 30%;
    background: #0b1c33;
    clip-path: polygon(
      0% 55%, 7% 38%, 14% 52%, 22% 30%, 30% 55%, 38% 40%, 47% 62%,
      55% 34%, 63% 50%, 71% 28%, 80% 48%, 88% 36%, 100% 58%, 100% 100%, 0% 100%);
  }
  .mountains.near {
    height: 22%;
    background: #04091c;
    clip-path: polygon(
      0% 62%, 9% 48%, 18% 66%, 28% 42%, 39% 64%, 50% 50%, 60% 70%,
      72% 46%, 83% 62%, 92% 52%, 100% 68%, 100% 100%, 0% 100%);
  }

  .moon {
    position: absolute;
    top: 10%;
    right: 12%;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    /* crescent: light disc with an offset dark disc punched over it */
    background: radial-gradient(circle at 66% 36%, transparent 58%, #f4f0d8 60%);
    filter: drop-shadow(0 0 14px rgba(244, 240, 216, .35));
  }

  /* ---------- config modal ---------- */
  .config {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 320px;
    padding: 20px 24px;
    border: 1px solid rgba(160, 180, 255, .18);
    border-radius: 14px;
    background: rgba(8, 12, 40, .82);
    backdrop-filter: blur(12px);
    color: #cfd6ff;
    font: 13px/1.45 system-ui, sans-serif;
  }
  .config[hidden] { display: none; }
  .config h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: #eaf0ff;
  }
  .cfg-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0 10px;
    margin-bottom: 12px;
  }
  .cfg-row output { color: #6ef2c0; font-variant-numeric: tabular-nums; }
  .cfg-row input {
    grid-column: 1 / -1;
    width: 100%;
    accent-color: #6ef2c0;
  }
  .config .hint {
    margin-top: 6px;
    color: rgba(207, 214, 255, .55);
  }
  kbd {
    padding: 1px 5px;
    border: 1px solid rgba(160, 180, 255, .3);
    border-bottom-width: 2px;
    border-radius: 4px;
    font: inherit;
  }

  .keyhint {
    position: fixed;
    right: 14px;
    bottom: 10px;
    z-index: 5;
    color: rgba(207, 214, 255, .45);
    font: 12px system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="stars"></div>
    <div class="glow"></div>
    <div class="ribbon"></div>
    <div class="moon"></div>
    <div class="mountains"></div>
    <div class="mountains near"></div>
  </div>

  <div class="config" id="config" role="dialog" aria-modal="true" aria-labelledby="cfg-title" hidden>
    <h2 id="cfg-title">Aurora config</h2>
    <div id="cfg-rows"></div>
    <p class="hint"><kbd>Enter</kbd> save &middot; <kbd>Esc</kbd> revert</p>
  </div>

  <div class="keyhint">press <kbd>c</kbd> to configure</div>

  <script>
    const KNOBS = [
      { key: 'slices',  label: 'Curtain slices',      min: 40,   max: 300,  step: 10 },
      { key: 'persp',   label: 'Camera focal length', min: 300,  max: 1200, step: 10 },
      { key: 'edge-y',  label: 'Tail altitude',       min: -300, max: 100,  step: 10 },
      { key: 'climb',   label: 'Approach climb',      min: 0,    max: 500,  step: 10 },
      { key: 'x-amp',   label: 'Snake amplitude',     min: 0,    max: 1200, step: 10 },
      { key: 'x-freq',  label: 'Snake frequency',     min: 180,  max: 900,  step: 10 },
      { key: 'rip-amp', label: 'Ripple amplitude',    min: 0,    max: 200,  step: 5 },
      { key: 'z-amp',   label: 'Depth wave',          min: 0,    max: 180,  step: 5 },
    ];
    const STORAGE_KEY = 'aurora-config';

    const root = document.documentElement;
    const ribbon = document.querySelector('.ribbon');
    const modal = document.getElementById('config');
    const rows = document.getElementById('cfg-rows');

    const defaults = Object.fromEntries(KNOBS.map(k =>
      [k.key, Number(getComputedStyle(root).getPropertyValue('--' + k.key))]));

    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}
    const cfg = { ...defaults, ...stored };
    let snapshot = null;
    const inputs = {};

    function buildSlices(n) {
      ribbon.replaceChildren();
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.style.setProperty('--i', i);
        ribbon.append(s);
      }
    }

    function apply() {
      for (const { key } of KNOBS) root.style.setProperty('--' + key, cfg[key]);
      if (ribbon.children.length !== cfg.slices) buildSlices(cfg.slices);
    }

    for (const knob of KNOBS) {
      const row = document.createElement('label');
      row.className = 'cfg-row';
      const name = document.createElement('span');
      name.textContent = knob.label;
      const val = document.createElement('output');
      const input = document.createElement('input');
      input.type = 'range';
      input.min = knob.min;
      input.max = knob.max;
      input.step = knob.step;
      input.addEventListener('input', () => {
        cfg[knob.key] = Number(input.value);
        val.value = input.value;
        apply();
      });
      inputs[knob.key] = { input, val };
      row.append(name, val, input);
      rows.append(row);
    }

    function openModal() {
      snapshot = { ...cfg };
      for (const { key } of KNOBS) {
        inputs[key].input.value = cfg[key];
        inputs[key].val.value = cfg[key];
      }
      modal.hidden = false;
      rows.querySelector('input').focus();
    }

    function closeModal() {
      modal.hidden = true;
      snapshot = null;
    }

    document.addEventListener('keydown', (e) => {
      if (modal.hidden) {
        if ((e.key === 'c' || e.key === 'C') && !e.metaKey && !e.ctrlKey && !e.altKey) {
          openModal();
        }
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch {}
        closeModal();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        Object.assign(cfg, snapshot);
        apply();
        closeModal();
      }
    });

    apply();                                        // initial slice build
    if (location.hash === '#config') openModal();   // deep link to the panel
  </script>
</body>
</html>
