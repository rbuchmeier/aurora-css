<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Ribbon — CSS</title>
<style>
  :root {
    /* ---- ribbon tuning knobs (all editable in the config modal, "c") ---- */
    --slices: 150;         /* number of vertical curtain slices               */
    --persp: 600;          /* camera focal length, px                         */
    --edge-y: -60;         /* bottom-edge height at the far tail (up = neg.)  */
    --climb: 240;          /* how much the edge climbs as the ribbon nears    */
    --x-amp: 780;          /* main snake amplitude                            */
    --x-freq: 540;         /* main snake frequency, deg over the full path    */
    --rip-amp: 65;         /* secondary ripple amplitude                      */
    --z-amp: 180;          /* depth wave amplitude — keep <= 180 so depth     */
                           /* stays monotonic (DOM order == paint order)      */
    --c-green: 1;          /* color toggles, 1 on / 0 off                     */
    --c-blue: 1;
    --c-pink: 1;

    /* ---- sky knobs (config modal, "s") ---- */
    --moon-phase: 12;      /* 0..200: 0 and 200 = new, 100 = full,            */
                           /* in between = crescents and gibbous              */
    --moon-size: 100;      /* percent of the base 46px moon; 75..200          */
    --twilight: 0;         /* 0..100: dusk glow rising from the horizon       */
    --star-bright: 80;     /* 0..100: star field opacity                      */
    --star-density: 100;   /* scales the star tiling; higher = more stars     */
    --mtn: 1;              /* mountains on / off                              */

    /* The toggles recolor a FIXED gradient shape — they never change the
       silhouette. Each stop has a priority chain (its native color, then
       fallbacks); these weights pick the first enabled color in the chain.
       --c-any gates the whole alpha profile: all off -> ribbon disappears. */
    --c-any: min(1, calc(var(--c-green) + var(--c-blue) + var(--c-pink)));
    /* fringe stop: blue, else green, else pink */
    --w-fr-b: var(--c-blue);
    --w-fr-g: calc(var(--c-green) * (1 - var(--c-blue)));
    --w-fr-p: calc(var(--c-pink) * (1 - var(--c-blue)) * (1 - var(--c-green)));
    /* bright-edge stop: green, else blue, else pink */
    --w-ed-g: var(--c-green);
    --w-ed-b: calc(var(--c-blue) * (1 - var(--c-green)));
    --w-ed-p: calc(var(--c-pink) * (1 - var(--c-green)) * (1 - var(--c-blue)));
    /* body stop: green, else pink (so pink reaches down to touch blue), else blue */
    --w-bd-g: var(--c-green);
    --w-bd-p: calc(var(--c-pink) * (1 - var(--c-green)));
    --w-bd-b: calc(var(--c-blue) * (1 - var(--c-green)) * (1 - var(--c-pink)));
    /* top stops: pink, else green, else blue */
    --w-tp-p: var(--c-pink);
    --w-tp-g: calc(var(--c-green) * (1 - var(--c-pink)));
    --w-tp-b: calc(var(--c-blue) * (1 - var(--c-pink)) * (1 - var(--c-green)));
  }

  * { margin: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    overflow: hidden;
    background: #03041a;
  }

  .scene {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(to bottom,
        #020217 0%,
        #060a2e 40%,
        #0b1a44 62%,
        #123056 78%,
        #0a1838 100%);
  }

  /* ---------- star field: tiled layers of tiny radial dots ---------- */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,.8), transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 35%, rgba(255,255,255,.9), transparent 100%),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,.7), transparent 100%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,.8), transparent 100%);
    background-size:
      calc(34000px / var(--star-density)) calc(34000px / var(--star-density)),
      calc(28000px / var(--star-density)) calc(28000px / var(--star-density)),
      calc(42000px / var(--star-density)) calc(42000px / var(--star-density)),
      calc(30000px / var(--star-density)) calc(30000px / var(--star-density)),
      calc(38000px / var(--star-density)) calc(38000px / var(--star-density)),
      calc(52000px / var(--star-density)) calc(52000px / var(--star-density));
    /* stars dim a little as twilight brightens the sky */
    opacity: calc(var(--star-bright) / 100 * (1 - var(--twilight) / 250));
  }

  /* dusk glow rising from the horizon, sits behind the mountains */
  .twilight {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top,
        rgba(125, 175, 215, .90)  0%,
        rgba( 80, 130, 190, .50) 20%,
        rgba( 45,  90, 160, .22) 42%,
        transparent 65%);
    opacity: calc(var(--twilight) / 100);
  }

  /* soft ambient glow washing up from behind the ribbon */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 65% at 50% 62%,
        rgba(45, 220, 170, .16) 0%,
        rgba(45, 200, 220, .07) 40%,
        transparent 70%);
    /* no colors lit -> no ambient glow either */
    opacity: var(--c-any);
  }

  /* ---------- the ribbon: a fan of slices laid along a 3D sine path ----------
     Each slice carries its own perspective() transform instead of living in a
     shared preserve-3d scene: identical projection, but painting is plain DOM
     order. Since z is monotonic along the path, DOM order == depth order, so
     we get correct layering with zero plane-splitting artifacts. */
  .ribbon {
    position: absolute;
    left: 50%;
    top: 60%;                       /* world origin = vanishing point */
    pointer-events: none;
  }

  .ribbon > div {
    /* t runs 0 -> 1 from the far end of the ribbon to the near end */
    --t: calc((var(--i) + 0.5) / var(--slices));

    /* serpentine path: the x-wave dominates the linear sweep, so the ribbon
       snakes right -> back left -> out right as it approaches; z only ever
       increases (monotonic depth = no slice intersections = no glitches) */
    --x: calc(-380 + 1500 * var(--t)
              + var(--x-amp) * sin(var(--t) * var(--x-freq) * 1deg + 150deg)
              + var(--rip-amp) * sin(var(--t) * 1260deg + 80deg));
    --z: calc(-2100 + 2150 * var(--t)
              + var(--z-amp) * sin(var(--t) * 680deg + 60deg));

    /* altitude climbs steadily as the ribbon approaches: on screen the far
       tail hugs the horizon and each closer band sits ABOVE the farther
       ones, so the bright bottom edge stays unobstructed the whole way
       (the near end runs off the top of the frame) */
    --y: calc(var(--edge-y) - var(--climb) * var(--t) * var(--t)
              - 30 * sin(var(--t) * var(--x-freq) * 1deg - 120deg));

    /* analytic tangent of the path above (d/dt), used to aim each slice;
       the amp * freq * pi/180 factors keep it in sync with the knobs */
    --dx: calc(1500
               + var(--x-amp) * var(--x-freq) * pi / 180
                 * cos(var(--t) * var(--x-freq) * 1deg + 150deg)
               + var(--rip-amp) * 1260 * pi / 180
                 * cos(var(--t) * 1260deg + 80deg));
    --dz: calc(2150
               + var(--z-amp) * 680 * pi / 180
                 * cos(var(--t) * 680deg + 60deg));

    /* cheap pseudo-randoms per slice: jagged ray tops + edge decoherence */
    --r: calc(0.5 + 0.5 * sin(var(--i) * 127.1));
    --r2: calc(0.5 + 0.5 * sin(var(--i) * 311.7));
    --jx: calc(20 * (var(--r2) - 0.5));
    --jy: calc(12 * (var(--r) - 0.5));

    /* the far tail grows in from nothing instead of a hard vertical cut */
    --taper: min(1, calc(var(--t) * 3));

    /* identical boxes, bottom-center pinned to the vanishing point, so every
       slice shares the same transform-origin (= camera position) */
    position: absolute;
    width: 150px;
    height: 460px;
    left: -75px;
    top: -460px;
    transform-origin: 50% 100%;
    transform:
      perspective(calc(var(--persp) * 1px))
      translate3d(calc((var(--x) + var(--jx)) * 1px),
                  calc((var(--y) + var(--jy)) * 1px),
                  calc(var(--z) * 1px))
      rotateY(clamp(-58deg,
        calc(mod(atan2(calc(-1 * var(--dz)), var(--dx)) + 90deg, 180deg) - 90deg),
        58deg));
      /* mod() folds the tangent into ±90° — a gradient slab looks the same
         rotated 180°, so return legs of the snake get the correct slant.
         The clamp keeps fold-apex slices from going knife-edge-on: they
         stack into a soft bright column instead of a hard line. */

    /* bright green lower edge, blue fringe underneath, fading to pink above.
       The alpha profile (the shape) is fixed; each stop's RGB is the
       priority-weighted blend of whichever colors are toggled on.
       Curtain height (ragged ray tops + tail taper) via background-size. */
    background:
      linear-gradient(to top,
        rgb(70 130 255 / 0) 0%,
        rgb(calc( 70*var(--w-fr-b) +  85*var(--w-fr-g) + 255*var(--w-fr-p))
            calc(130*var(--w-fr-b) + 255*var(--w-fr-g) +  90*var(--w-fr-p))
            calc(255*var(--w-fr-b) + 185*var(--w-fr-g) + 190*var(--w-fr-p))
            / calc(.45 * var(--c-any)))  4%,
        rgb(calc( 90*var(--w-ed-g) +  70*var(--w-ed-b) + 255*var(--w-ed-p))
            calc(255*var(--w-ed-g) + 130*var(--w-ed-b) +  90*var(--w-ed-p))
            calc(180*var(--w-ed-g) + 255*var(--w-ed-b) + 190*var(--w-ed-p))
            / calc(.95 * var(--c-any)))  9%,
        rgb(calc( 70*var(--w-bd-g) + 220*var(--w-bd-p) +  70*var(--w-bd-b))
            calc(245*var(--w-bd-g) + 115*var(--w-bd-p) + 130*var(--w-bd-b))
            calc(185*var(--w-bd-g) + 210*var(--w-bd-p) + 255*var(--w-bd-b))
            / calc(.55 * var(--c-any))) 24%,
        rgb(calc(200*var(--w-tp-p) +  75*var(--w-tp-g) +  80*var(--w-tp-b))
            calc(130*var(--w-tp-p) + 235*var(--w-tp-g) + 160*var(--w-tp-b))
            calc(225*var(--w-tp-p) + 190*var(--w-tp-g) + 250*var(--w-tp-b))
            / calc(.26 * var(--c-any))) 46%,
        rgb(calc(255*var(--w-tp-p) +  80*var(--w-tp-g) +  70*var(--w-tp-b))
            calc( 90*var(--w-tp-p) + 225*var(--w-tp-g) + 130*var(--w-tp-b))
            calc(190*var(--w-tp-p) + 195*var(--w-tp-g) + 255*var(--w-tp-b))
            / calc(.09 * var(--c-any))) 72%,
        rgb(255 90 190 / 0) 94%)
      bottom / 100% calc((300px + 160px * var(--r)) * var(--taper)) no-repeat;

    /* feather the vertical sides so slices melt together */
    -webkit-mask: linear-gradient(90deg, transparent, #000 33%, #000 67%, transparent);
            mask: linear-gradient(90deg, transparent, #000 33%, #000 67%, transparent);

    /* haze: the far end fades out like real atmosphere */
    opacity: calc((0.22 + 0.70 * var(--t)) * var(--taper) * var(--taper));
  }

  /* ---------- foreground: mountain silhouettes ---------- */
  .mountains {
    position: absolute;
    inset: auto 0 0 0;
    opacity: var(--mtn);
    height: 30%;
    background: #0b1c33;
    clip-path: polygon(
      0% 55%, 7% 38%, 14% 52%, 22% 30%, 30% 55%, 38% 40%, 47% 62%,
      55% 34%, 63% 50%, 71% 28%, 80% 48%, 88% 36%, 100% 58%, 100% 100%, 0% 100%);
  }
  .mountains.near {
    height: 22%;
    background: #04091c;
    clip-path: polygon(
      0% 62%, 9% 48%, 18% 66%, 28% 42%, 39% 64%, 50% 50%, 60% 70%,
      72% 46%, 83% 62%, 92% 52%, 100% 68%, 100% 100%, 0% 100%);
  }

  .moon {
    position: absolute;
    top: 10%;
    right: 12%;
    width: calc(46px * var(--moon-size) / 100);
    height: calc(46px * var(--moon-size) / 100);
    filter: drop-shadow(0 0 14px rgba(244, 240, 216, .35));

    /* True phase geometry: the terminator is an ellipse whose x-semiaxis
       follows |cos| of the phase. The lit shape = one half of the disc,
       plus a lit center ellipse when gibbous, or minus a dark center
       ellipse when crescent. Quarter = zero-width ellipse (straight
       terminator); new = the hole swallows the whole half (invisible).
         --m-ell:  terminator x-semiaxis, % of the box (0..50)
         --m-side: 1 = waxing (right half lit), 0 = waning (left half)
         --m-gib:  1 = gibbous (ellipse adds light), 0 = crescent (hole) */
    --m-ell: calc(50 * abs(cos(var(--moon-phase) * 1.8deg)));
    --m-side: clamp(0, 100 - var(--moon-phase), 1);
    --m-gib: clamp(0, 50.5 - abs(var(--moon-phase) - 100), 1);
  }

  /* the lit half-disc, with the terminator ellipse carved out when crescent
     (two mask layers intersected: half-plane AND outside-the-ellipse) */
  .moon::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #f4f0d8;
    -webkit-mask-image:
      linear-gradient(90deg,
        rgb(0 0 0 / calc(1 - var(--m-side))) 0 50%,
        rgb(0 0 0 / var(--m-side)) 50% 100%),
      radial-gradient(calc(var(--m-ell) * 1%) 51% at 50% 50%,
        rgb(0 0 0 / var(--m-gib)) 97%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(90deg,
        rgb(0 0 0 / calc(1 - var(--m-side))) 0 50%,
        rgb(0 0 0 / var(--m-side)) 50% 100%),
      radial-gradient(calc(var(--m-ell) * 1%) 51% at 50% 50%,
        rgb(0 0 0 / var(--m-gib)) 97%, #000 100%);
    mask-composite: intersect;
  }

  /* the lit terminator ellipse, shown only in the gibbous phases */
  .moon::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: calc(var(--m-ell) * 2%);
    transform: translateX(-50%);
    border-radius: 50%;
    background: #f4f0d8;
    opacity: var(--m-gib);
  }

  /* ---------- config modal ---------- */
  .config {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 320px;
    padding: 20px 24px;
    border: 1px solid rgba(160, 180, 255, .18);
    border-radius: 14px;
    background: rgba(8, 12, 40, .82);
    backdrop-filter: blur(12px);
    color: #cfd6ff;
    font: 13px/1.45 system-ui, sans-serif;
  }
  .config[hidden] { display: none; }
  .config h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: #eaf0ff;
  }
  .cfg-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0 10px;
    margin-bottom: 12px;
  }
  .cfg-row output { color: #6ef2c0; font-variant-numeric: tabular-nums; }
  .cfg-row input {
    grid-column: 1 / -1;
    width: 100%;
    accent-color: #6ef2c0;
  }
  .cfg-checks {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
  }
  .cfg-checks > span { flex: 1; }
  .cfg-checks label {
    display: flex;
    gap: 5px;
    align-items: center;
    cursor: pointer;
  }
  .cfg-checks input { accent-color: #6ef2c0; margin: 0; }

  .config .hint {
    margin-top: 6px;
    color: rgba(207, 214, 255, .55);
  }
  kbd {
    padding: 1px 5px;
    border: 1px solid rgba(160, 180, 255, .3);
    border-bottom-width: 2px;
    border-radius: 4px;
    font: inherit;
  }

  .keyhint {
    position: fixed;
    right: 14px;
    bottom: 10px;
    z-index: 5;
    color: rgba(207, 214, 255, .45);
    font: 12px system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="stars"></div>
    <div class="twilight"></div>
    <div class="glow"></div>
    <div class="ribbon"></div>
    <div class="moon"></div>
    <div class="mountains"></div>
    <div class="mountains near"></div>
  </div>

  <div class="config" id="config" role="dialog" aria-modal="true" aria-labelledby="cfg-title" hidden>
    <h2 id="cfg-title">Aurora config</h2>
    <div class="rows"></div>
    <p class="hint"><kbd>Enter</kbd> save &middot; <kbd>Esc</kbd> revert</p>
  </div>

  <div class="config" id="sky" role="dialog" aria-modal="true" aria-labelledby="sky-title" hidden>
    <h2 id="sky-title">Sky config</h2>
    <div class="rows"></div>
    <p class="hint"><kbd>Enter</kbd> save &middot; <kbd>Esc</kbd> revert</p>
  </div>

  <div class="keyhint"><kbd>c</kbd> aurora &middot; <kbd>s</kbd> sky</div>

  <script>
    const PANELS = [
      {
        id: 'config',
        hotkey: 'c',
        knobs: [
          { key: 'slices',  label: 'Curtain slices',      min: 40,   max: 300,  step: 10 },
          { key: 'persp',   label: 'Camera focal length', min: 300,  max: 1200, step: 10 },
          { key: 'edge-y',  label: 'Tail altitude',       min: -300, max: 100,  step: 10 },
          { key: 'climb',   label: 'Approach climb',      min: 0,    max: 500,  step: 10 },
          { key: 'x-amp',   label: 'Snake amplitude',     min: 0,    max: 1200, step: 10 },
          { key: 'x-freq',  label: 'Snake frequency',     min: 180,  max: 900,  step: 10 },
          { key: 'rip-amp', label: 'Ripple amplitude',    min: 0,    max: 200,  step: 5 },
          { key: 'z-amp',   label: 'Depth wave',          min: 0,    max: 180,  step: 5 },
        ],
        toggles: {
          label: 'Colors',
          items: [
            { key: 'c-green', label: 'Green' },
            { key: 'c-blue',  label: 'Blue'  },
            { key: 'c-pink',  label: 'Pink'  },
          ],
        },
      },
      {
        id: 'sky',
        hotkey: 's',
        knobs: [
          { key: 'moon-phase',   label: 'Moon phase',      min: 0,  max: 200, step: 1  },
          { key: 'moon-size',    label: 'Moon size',       min: 75, max: 200, step: 5  },
          { key: 'twilight',     label: 'Twilight',        min: 0,  max: 100, step: 5  },
          { key: 'star-bright',  label: 'Star brightness', min: 0,  max: 100, step: 5  },
          { key: 'star-density', label: 'Star density',    min: 30, max: 250, step: 10 },
        ],
        toggles: {
          label: 'Scenery',
          items: [{ key: 'mtn', label: 'Mountains' }],
        },
      },
    ];
    const STORAGE_KEY = 'aurora-config';

    const root = document.documentElement;
    const ribbon = document.querySelector('.ribbon');
    const ALL = PANELS.flatMap(p => [...p.knobs, ...p.toggles.items]);

    const defaults = Object.fromEntries(ALL.map(k =>
      [k.key, Number(getComputedStyle(root).getPropertyValue('--' + k.key))]));

    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}
    const cfg = { ...defaults, ...stored };
    let active = null;
    let snapshot = null;
    const inputs = {};

    function buildSlices(n) {
      ribbon.replaceChildren();
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.style.setProperty('--i', i);
        ribbon.append(s);
      }
    }

    function apply() {
      for (const { key } of ALL) root.style.setProperty('--' + key, cfg[key]);
      if (ribbon.children.length !== cfg.slices) buildSlices(cfg.slices);
    }

    for (const panel of PANELS) {
      panel.el = document.getElementById(panel.id);
      const rows = panel.el.querySelector('.rows');
      for (const knob of panel.knobs) {
        const row = document.createElement('label');
        row.className = 'cfg-row';
        const name = document.createElement('span');
        name.textContent = knob.label;
        const val = document.createElement('output');
        const input = document.createElement('input');
        input.type = 'range';
        input.min = knob.min;
        input.max = knob.max;
        input.step = knob.step;
        input.addEventListener('input', () => {
          cfg[knob.key] = Number(input.value);
          val.value = input.value;
          apply();
        });
        inputs[knob.key] = { input, val };
        row.append(name, val, input);
        rows.append(row);
      }
      const row = document.createElement('div');
      row.className = 'cfg-checks';
      const name = document.createElement('span');
      name.textContent = panel.toggles.label;
      row.append(name);
      for (const toggle of panel.toggles.items) {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.addEventListener('change', () => {
          cfg[toggle.key] = input.checked ? 1 : 0;
          apply();
        });
        inputs[toggle.key] = { input };
        label.append(input, toggle.label);
        row.append(label);
      }
      rows.append(row);
    }

    function openPanel(panel) {
      snapshot = { ...cfg };
      for (const item of ALL) {
        const entry = inputs[item.key];
        if (entry.val) {
          entry.input.value = cfg[item.key];
          entry.val.value = cfg[item.key];
        } else {
          entry.input.checked = cfg[item.key] === 1;
        }
      }
      panel.el.hidden = false;
      active = panel;
      panel.el.querySelector('input').focus();
    }

    function closePanel() {
      active.el.hidden = true;
      active = null;
      snapshot = null;
    }

    document.addEventListener('keydown', (e) => {
      if (!active) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const panel = PANELS.find(p => p.hotkey === e.key.toLowerCase());
        if (panel) openPanel(panel);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch {}
        closePanel();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        Object.assign(cfg, snapshot);
        apply();
        closePanel();
      }
    });

    apply();                                        // initial slice build
    if (location.hash === '#config') openPanel(PANELS[0]);   // deep links
    if (location.hash === '#sky') openPanel(PANELS[1]);
  </script>
</body>
</html>
